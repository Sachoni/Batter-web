<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batter</title>

<link rel="stylesheet" href="styles/market.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 15px;
    background:#fff;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.search-container{
    flex:1;
    display:flex;
    justify-content:center;
    margin:0 15px;
}

.search-box{
    width:100%;
    max-width:500px;
    display:flex;
    align-items:center;
    border:1px solid #ccc;
    border-radius:25px;
    overflow:hidden;
    background:#f9f9f9;
}

.search-box input{
    flex:1;
    border:none;
    outline:none;
    padding:10px 15px;
    background:transparent;
}

.search-box button{
    border:none;
    background:#ddd;
    padding:10px 15px;
    cursor:pointer;
}

.header-icons{
    display:flex;
    gap:15px;
    font-size:20px;
}

.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:10px;
}

</style>

</head>

<body>

<header class="header">

<div class="logo">Home</div>

<div class="search-container">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search...">
        <button><i class="fas fa-search"></i></button>
    </div>
</div>

<div class="header-icons">
    <a href="profilecard.html">
        <i class="fas fa-user-circle"></i>
    </a>
</div>

</header>

<!-- PRODUCTS -->
<div class="products" id="products"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="market.html"><i class="fas fa-home"></i></a>
  <a href="uploadscreen.html"><i class="fas fa-plus-circle"></i></a>
  <a href="notifications.html"><i class="fas fa-bell"></i></a>
</nav>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCe6zcYlkBlgcOllDlTreozApj24fQIdZY",
  authDomain: "batter-53f91.firebaseapp.com",
  projectId: "batter-53f91",
  storageBucket: "batter-53f91.appspot.com",
  messagingSenderId: "825703034072",
  appId: "1:825703034072:web:a416764346918e6da3bbad"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const productBox = document.getElementById("products");

async function loadProducts(){

    productBox.innerHTML = "Loading products...";

    const snapshot = await getDocs(collection(db,"products"));

    productBox.innerHTML = "";

    snapshot.forEach((doc)=>{

        const data = doc.data();

        const card = `
        <div style="
            width:170px;
            margin:10px;
            background:#fff;
            border-radius:12px;
            padding:10px;
            box-shadow:0 2px 6px rgba(0,0,0,0.1);
        ">

            <img src="${data.image}" 
                 style="width:100%;height:120px;object-fit:cover;border-radius:10px;">

            <h4>${data.productName}</h4>

            <p style="color:green;font-weight:bold;">
                KES ${data.rate}
            </p>

            <small>${data.category}</small>

            <button style="
                width:100%;
                margin-top:8px;
                padding:6px;
                background:#22c55e;
                color:white;
                border:none;
                border-radius:8px;
            ">
                Buy
            </button>

        </div>
        `;

        productBox.innerHTML += card;
    });
}

loadProducts();

</script>

</body>
</html>
