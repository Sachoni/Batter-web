<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Batter - Edit Profile</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

/* BODY */
body{
    background:#edce70;
    min-height:100vh;
}

/* HEADER */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:#d4a017;
    display:flex;
    align-items:center;
    padding:0 20px;
    z-index:1000;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:white;
}

/* MAIN */
.container{
    width:100%;
    max-width:450px;
    margin:90px auto 30px;
    padding:20px;
    background:rgba(255,255,255,0.15);
    border-radius:15px;
}

/* BACK BUTTON */
.back-btn{
    background:#ffea00;
    border:none;
    border-radius:10px;
    padding:10px 15px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:20px;
}

/* ROW */
.row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

label{
    font-weight:bold;
    color:white;
}

input{
    flex:1;
    min-width:180px;
    height:40px;
    padding:5px 10px;
    border-radius:8px;
    border:none;
    outline:none;
}

/* BUTTONS */
.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    flex:1;
    min-width:120px;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.edit-btn{
    background:#22c55e;
    color:white;
}

.save-btn{
    background:#e11d48;
    color:white;
}

/* MODAL */
.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    visibility:hidden;
    transition:0.3s ease;
}

.modal.active{
    opacity:1;
    visibility:visible;
}

.modal-content{
    background:white;
    width:90%;
    max-width:350px;
    padding:20px;
    border-radius:15px;
    transform:scale(0.7);
    transition:0.3s ease;
}

.modal.active .modal-content{
    transform:scale(1);
}

.modal-content h3{
    margin-bottom:15px;
}

.modal-content input{
    width:100%;
    height:40px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    padding:5px 10px;
}

.modal-content button{
    width:100%;
    background:#22c55e;
    color:white;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* RESPONSIVE */
@media(max-width:600px){
    .container{ width:92%; }
    button{ min-width:100%; }
    input{ min-width:100%; }
}

</style>
</head>

<body>

<div class="header">
    <div class="logo">Batter</div>
</div>

<div class="container">

<button class="back-btn" onclick="history.back()">← Go Back</button>

<div class="row">
<label>Name:</label>
<input id="displayName" value="" readonly>
</div>

<div class="buttons">
<button class="edit-btn" onclick="openModal()">Edit</button>
<button class="save-btn" onclick="saveName()">Save</button>
</div>

</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="outsideClick(event)">
    <div class="modal-content">
        <h3>Edit Name</h3>
        <input type="text" id="newName" placeholder="Enter new name">
        <button onclick="updateName()">Update Name</button>
    </div>
</div>

<script type="module">

/* FIREBASE IMPORTS */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCe6zcYlkBlgcOllDlTreozApj24fQIdZY",
  authDomain: "batter-53f91.firebaseapp.com",
  projectId: "batter-53f91",
  storageBucket: "batter-53f91.firebasestorage.app",
  messagingSenderId: "825703034072",
  appId: "1:825703034072:web:a416764346918e6da3bbad"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let userId = null;

/* AUTH CHECK */
onAuthStateChanged(auth, async (user) => {

    if(user){
        userId = user.uid;

        const ref = doc(db, "users", userId);
        const snap = await getDoc(ref);

        if(snap.exists()){
            document.getElementById("displayName").value =
            snap.data().username || "";
        }
    }

});

/* OPEN MODAL */
window.openModal = function(){
    document.getElementById("modal").classList.add("active");
};

/* CLOSE MODAL */
window.closeModal = function(){
    document.getElementById("modal").classList.remove("active");
};

/* OUTSIDE CLICK */
window.outsideClick = function(e){
    if(e.target.id === "modal"){
        closeModal();
    }
};

/* UPDATE NAME (MODAL) */
window.updateName = async function(){

    const name = document.getElementById("newName").value;

    if(name.trim() === ""){
        alert("Name cannot be empty!");
        return;
    }

    document.getElementById("displayName").value = name;

    if(!userId){
        alert("User not logged in!");
        return;
    }

    await setDoc(doc(db,"users",userId),{
        username: name
    }, { merge:true });

    closeModal();
    alert("Name updated!");
};

/* SAVE BUTTON */
window.saveName = async function(){

    const name = document.getElementById("displayName").value;

    if(name.trim() === ""){
        alert("Cannot save empty name!");
        return;
    }

    if(!userId){
        alert("User not logged in!");
        return;
    }

    await updateDoc(doc(db,"users",userId),{
        username: name
    });

    alert("Profile saved to database!");
};

</script>

</body>
</html>
